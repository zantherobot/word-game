<!DOCTYPE html>
<html>
<head><title>Rotation Letter Test</title></head>
<body>
<h2>Rotation Letter Persistence Test</h2>
<pre id="output"></pre>
<script>
// Minimal game dependencies for testing
const COLS = 10;
const ROWS = 20;

const SHAPES = {
  I: [[[0,0],[1,0],[2,0],[3,0]], [[0,0],[0,1],[0,2],[0,3]]],
  O: [[[0,0],[1,0],[0,1],[1,1]]],
  T: [[[0,0],[1,0],[2,0],[1,1]], [[0,0],[0,1],[0,2],[1,1]], [[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[0,1]]],
  S: [[[1,0],[2,0],[0,1],[1,1]], [[0,0],[0,1],[1,1],[1,2]]],
  Z: [[[0,0],[1,0],[1,1],[2,1]], [[1,0],[1,1],[0,1],[0,2]]],
  L: [[[0,0],[1,0],[2,0],[0,1]], [[0,0],[1,0],[1,1],[1,2]], [[2,0],[0,1],[1,1],[2,1]], [[0,0],[0,1],[0,2],[1,2]]],
  J: [[[0,0],[1,0],[2,0],[2,1]], [[0,0],[1,0],[0,1],[0,2]], [[0,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[0,2]]]
};

const SHAPE_NAMES = Object.keys(SHAPES);

let board = [];
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) board.push(new Array(COLS).fill(null));
}

function isValidPosition(piece, offsetX = 0, offsetY = 0) {
  for (const [cx, cy] of piece.cells) {
    const nx = piece.x + cx + offsetX;
    const ny = piece.y + cy + offsetY;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return false;
    if (board[ny][nx] !== null) return false;
  }
  return true;
}

function rotatePiece(piece, direction) {
  const rotations = SHAPES[piece.shapeName];
  const newRot = (piece.rotation + direction + rotations.length) % rotations.length;
  const newCells = rotations[newRot];
  const testPiece = { ...piece, rotation: newRot, cells: newCells };

  for (const dx of [0, -1, 1, -2, 2]) {
    testPiece.x = piece.x + dx;
    if (isValidPosition(testPiece)) {
      piece.rotation = newRot;
      piece.cells = newCells;
      piece.x = testPiece.x;
      return true;
    }
  }
  return false;
}

// --- Tests ---
const output = document.getElementById('output');
let passed = 0;
let failed = 0;

function assert(condition, msg) {
  if (condition) {
    passed++;
    output.textContent += `  PASS: ${msg}\n`;
  } else {
    failed++;
    output.textContent += `  FAIL: ${msg}\n`;
  }
}

function arraysEqual(a, b) {
  return a.length === b.length && a.every((v, i) => v === b[i]);
}

// Test 1: Letters unchanged after CW rotation for all shapes
output.textContent += 'Test 1: Letters unchanged after single CW rotation\n';
initBoard();
for (const name of SHAPE_NAMES) {
  const rotations = SHAPES[name];
  if (rotations.length <= 1) continue; // skip O piece
  const piece = {
    shapeName: name,
    rotation: 0,
    x: 4,
    y: 5,
    cells: rotations[0],
    letters: ['A', 'B', 'C', 'D'],
    color: '#fff'
  };
  const lettersBefore = [...piece.letters];
  rotatePiece(piece, 1);
  assert(arraysEqual(piece.letters, lettersBefore),
    `${name} piece: letters [${lettersBefore}] unchanged after CW rotation, got [${piece.letters}]`);
}

// Test 2: Letters unchanged after CCW rotation
output.textContent += '\nTest 2: Letters unchanged after single CCW rotation\n';
initBoard();
for (const name of SHAPE_NAMES) {
  const rotations = SHAPES[name];
  if (rotations.length <= 1) continue;
  const piece = {
    shapeName: name,
    rotation: 0,
    x: 4,
    y: 5,
    cells: rotations[0],
    letters: ['W', 'X', 'Y', 'Z'],
    color: '#fff'
  };
  const lettersBefore = [...piece.letters];
  rotatePiece(piece, -1);
  assert(arraysEqual(piece.letters, lettersBefore),
    `${name} piece: letters [${lettersBefore}] unchanged after CCW rotation, got [${piece.letters}]`);
}

// Test 3: Letters unchanged after full 360° rotation
output.textContent += '\nTest 3: Letters unchanged after full 360° rotation\n';
initBoard();
for (const name of SHAPE_NAMES) {
  const rotations = SHAPES[name];
  if (rotations.length <= 1) continue;
  const piece = {
    shapeName: name,
    rotation: 0,
    x: 4,
    y: 5,
    cells: rotations[0],
    letters: ['M', 'N', 'O', 'P'],
    color: '#fff'
  };
  const lettersBefore = [...piece.letters];
  for (let i = 0; i < rotations.length; i++) {
    rotatePiece(piece, 1);
  }
  assert(arraysEqual(piece.letters, lettersBefore),
    `${name} piece: letters [${lettersBefore}] unchanged after full rotation cycle, got [${piece.letters}]`);
}

// Test 4: Letters unchanged after multiple mixed rotations
output.textContent += '\nTest 4: Letters unchanged after CW then CCW (back to start)\n';
initBoard();
for (const name of SHAPE_NAMES) {
  const rotations = SHAPES[name];
  if (rotations.length <= 1) continue;
  const piece = {
    shapeName: name,
    rotation: 0,
    x: 4,
    y: 5,
    cells: rotations[0],
    letters: ['R', 'S', 'T', 'U'],
    color: '#fff'
  };
  const lettersBefore = [...piece.letters];
  rotatePiece(piece, 1);
  rotatePiece(piece, -1);
  assert(arraysEqual(piece.letters, lettersBefore),
    `${name} piece: letters unchanged after CW+CCW, got [${piece.letters}]`);
}

// Summary
output.textContent += `\n=============================\n`;
output.textContent += `Results: ${passed} passed, ${failed} failed\n`;
if (failed === 0) {
  output.textContent += 'All tests passed!\n';
}
</script>
</body>
</html>
